services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Di dalam compose, Postgres diakses lewat host `db` (nama service di
      # network compose), BUKAN localhost. Nilai ini meng-override
      # DATABASE_URL dari .env yang menunjuk ke database dev.
      DATABASE_URL: postgresql://belajarduludek:cXEwpc62MRTMaRTf@db:5432/belajarduludek
    volumes:
      # Upload runtime (gambar flashcard, PDF buku) bertahan di luar container.
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: belajarduludek
      POSTGRES_USER: belajarduludek
      POSTGRES_PASSWORD: cXEwpc62MRTMaRTf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belajarduludek -d belajarduludek"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  uploads:
